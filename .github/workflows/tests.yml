name: Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  unit:
    name: 🧪 Unit
    uses: ./.github/workflows/node-ci.yml
    with:
      run-command: |
        npm run test:unit

  component:
    name: 🧩 Component
    uses: ./.github/workflows/node-ci.yml
    with:
      run-command: |
        npm run test:component

  integration:
    name: 🪢 Integration
    uses: ./.github/workflows/node-ci.yml
    with:
      run-command: |
        npm run test:integration

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Cypress run
        uses: cypress-io/github-action@v7
        with:
          start: npm run dev
          wait-on: "http://localhost:5173"
